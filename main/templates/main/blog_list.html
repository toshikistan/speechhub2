{% extends 'main/base.html' %}
{% block content %}
<h2>Блог</h2>
{% if user.is_authenticated %}<p><a href="{% url 'blog_create' %}">+ Добавить статью</a></p>{% endif %}
{% for p in posts %}
<article><h3><a href="{{ p.get_absolute_url }}">{{ p.title }}</a></h3><p>{{ p.excerpt|default:p.content|truncatechars:180 }}</p></article>
{% empty %}<p>Статей нет.</p>{% endfor %}
{% endblock %}
