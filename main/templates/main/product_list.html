{% extends 'main/base.html' %}
{% block content %}
<h2>Маркетплейс</h2>
{% if user.is_authenticated %}<p><a href="{% url 'product_create' %}">+ Выложить материал</a></p>{% endif %}
{% for p in products %}
  <article>
    <h3><a href="{{ p.get_absolute_url }}">{{ p.title }}</a></h3>
    <p>{{ p.description|truncatechars:160 }}</p>
    <p><b>{{ p.price }} ₽</b></p>
  </article>
{% empty %}<p>Материалов пока нет.</p>{% endfor %}
{% endblock %}
