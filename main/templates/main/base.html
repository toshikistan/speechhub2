{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpeechHub</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
<header>
  <h1><a href="{% url 'home' %}">SpeechHub</a></h1>
  <nav>
    <a href="{% url 'blog_list' %}">Блог</a>
    <a href="{% url 'product_list' %}">Маркетплейс</a>
    <a href="{% url 'forum_list' %}">Форум</a>
    {% if user.is_authenticated %}
      <a href="{% url 'my_dashboard' %}">Кабинет</a>
      <a href="{% url 'logout' %}">Выйти</a>
    {% else %}
      <a href="{% url 'login' %}">Войти</a>
      <a href="{% url 'register' %}">Регистрация</a>
    {% endif %}
  </nav>
</header>
<main>
  {% for message in messages %}<p class="msg">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
